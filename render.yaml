services:
  - type: web
    name: gomandap-scraper-backend
    env: node
    rootDir: gomandap-scraper/server
    buildCommand: npm install && npx playwright install --with-deps chromium firefox
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5002
      - key: MONGODB_URI
        sync: false # Set this in the Render dashboard
