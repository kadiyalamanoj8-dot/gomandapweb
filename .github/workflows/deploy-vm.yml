name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/gomandapweb
            git reset --hard HEAD
            git clean -fd
            git pull origin main
            
            echo "Installing dependencies and building backend..."
            cd backend
            npm install
            
            echo "Installing dependencies and building client..."
            cd ../client
            npm install
            npm run build
            
            echo "Installing dependencies and building vendor..."
            cd ../vendor
            npm install
            npm run build
            
            echo "Installing dependencies and building admin..."
            cd ../admin
            npm install
            npm run build
            
            echo "Restarting PM2 Services..."
            cd ..
            npx pm2 stop pm2.config.js
            npx pm2 start pm2.config.js
