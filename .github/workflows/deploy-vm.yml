name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/gomandapweb
            git pull origin main
            
            # Install & Build Backend
            cd backend && npm install
            
            # Install & Build Frontends
            cd ../client && npm install && npm run build
            cd ../vendor && npm install && npm run build
            cd ../admin && npm install && npm run build
            
            # Restart backend and reload nginx
            cd ..
            npx pm2 restart gomandap-backend
            sudo systemctl reload nginx.

            echo "==> Killing PM2 daemon and freeing all ports..."
            npx pm2 kill || true
            fuser -k 3000/tcp 3001/tcp 3002/tcp 5000/tcp 2>/dev/null || true
            sleep 2

            echo "==> Starting all PM2 services fresh..."
            cd /home/opc/gomandapweb
            npx pm2 start /home/opc/gomandapweb/pm2.config.js
            npx pm2 save

            echo "==> Deployment complete! Checking status..."
            npx pm2 list
