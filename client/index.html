<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="http://localhost:5000" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <!-- Preload massive hero images to prevent lag -->
    <link rel="preload" href="/images/couple_transparent.webp" as="image" type="image/webp" fetchpriority="high">
    <link rel="preload" href="/images/modern_gazebo.webp" as="image" type="image/webp" fetchpriority="high">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Gomandap | Book Premium Event Vendors</title>
    <link rel="canonical" href="https://gomandap.com" />
    <meta property="og:url" content="https://gomandap.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gomandap" />
    <meta property="og:image" content="https://gomandap.com/logo.svg" />
    <meta property="og:logo" content="https://gomandap.com/logo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "url": "https://gomandap.com",
      "logo": "https://gomandap.com/logo.svg",
      "name": "Gomandap",
      "description": "Book Premium Event Vendors in India",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9999999999",
        "contactType": "Customer Support"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // EMERGENCY CACHE BUSTER: Unregister orphaned Service Workers from removed VitePWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function() {
              console.log('Service Worker unregistered successfully.');
            });
          }
        });
      }
    </script>
  </body>
</html>
